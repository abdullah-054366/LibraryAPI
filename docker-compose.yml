services:
  backend:
    build: ./backend
    env_file:
      - backend/.env
    ports:
      - "5000:5000"

  mongo:
    image: mongo
    volumes:
      - mongo-data:/data/db

  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - webroot:/var/www/certbot
    depends_on:
      - backend

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot \
      -d abdullahdev.cloud \
      -d www.abdullahdev.cloud \
      --email asd054366@gmil.com \
      --non-interactive --agree-tos --keep-until-expiring
    depends_on:
      - nginx

volumes:
  mongo-data:
  certbot-etc:
  certbot-var:
  webroot: