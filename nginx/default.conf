server {

    location / {

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }
}



server {
    listen 80;
    server_name abdullahdev.cloud www.abdullahdev.cloud;

    # السماح لـ Certbot بقراءة ملفات التحقق دون تحويله إلى HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

  # تحويل أي طلب آخر (غير التحقق) إلى HTTPS تلقائياً
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name abdullahdev.cloud www.abdullahdev.cloud;

    ssl_certificate /etc/letsencrypt/live/abdullahdev.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abdullahdev.cloud/privkey.pem;

    # إعدادات الأمان الأساسية للـ SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # لضمان عمل التجديد مستقبلاً عبر الـ HTTPS أيضاً إن لزم الأمر
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /libraryapi/ {
        proxy_pass http://backend:5000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}